name: Test specific upterm version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check upterm server connectivity
        id: connectivity
        run: |
          if nc -z -w 5 uptermd.upterm.dev 22 2>/dev/null; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
            echo "Upterm server is reachable"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "Upterm server is NOT reachable - session test will be skipped"
          fi

      - id: action
        if: steps.connectivity.outputs.reachable == 'true'
        uses: .
        with:
          upterm-server: "ssh://uptermd.upterm.dev:22"
          upterm-version: "v0.20.0"
          detached: "true"
          wait-timeout-minutes: "1"

      - name: Assert ssh-command output is set with specific version
        if: steps.connectivity.outputs.reachable == 'true'
        env:
          SSH_CMD: ${{ steps.action.outputs.ssh-command }}
        run: |
          echo "ssh-command: $SSH_CMD"
          if [ -z "$SSH_CMD" ]; then
            echo "FAIL: expected ssh-command output to be non-empty when using specific upterm version"
            exit 1
          fi
          if ! echo "$SSH_CMD" | grep -qE '^ssh '; then
            echo "FAIL: expected ssh-command to start with 'ssh '"
            exit 1
          fi
          echo "PASS: ssh-command is set with specific upterm version: $SSH_CMD"

      - name: Assert upterm binary is installed and correct version
        if: steps.connectivity.outputs.reachable == 'true'
        run: |
          echo "Checking upterm version..."
          INSTALLED_VERSION=$(upterm version 2>&1 || true)
          echo "Installed version output: $INSTALLED_VERSION"
          if ! echo "$INSTALLED_VERSION" | grep -qE '0\.20\.0|v0\.20\.0'; then
            echo "FAIL: expected upterm version 0.20.0 to be installed, got: $INSTALLED_VERSION"
            exit 1
          fi
          echo "PASS: upterm v0.20.0 is installed"

      - name: Skip notice when server unreachable
        if: steps.connectivity.outputs.reachable != 'true'
        run: |
          echo "SKIP: upterm server not reachable from this environment, skipping connectivity-dependent assertions"
          echo "PASS: test skipped gracefully"
