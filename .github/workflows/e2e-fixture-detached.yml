name: E2E Fixture (Detached)

on:
  workflow_dispatch:

permissions: {}

jobs:
  upterm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Start upterm session (detached)
        id: upterm
        uses: ./detached

      - name: Verify workflow continued
        env:
          SSH_COMMAND: ${{ steps.upterm.outputs.ssh-command }}
        run: |
          echo "DETACHED_WORKFLOW_CONTINUED"
          echo "SSH_OUTPUT=$SSH_COMMAND"
