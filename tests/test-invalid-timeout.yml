name: Test invalid wait-timeout-minutes input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          upterm-server: "ssh://uptermd.upterm.dev:22"
          wait-timeout-minutes: "not-a-number"
          detached: "true"
        continue-on-error: true

      - name: Assert action failed with invalid timeout
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid wait-timeout-minutes, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid wait-timeout-minutes"
