name: Test limit-access-to-actor
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: upterm
        uses: .
        with:
          upterm-server: "ssh://uptermd.upterm.dev:22"
          detached: "true"
          wait-timeout-minutes: "1"
          limit-access-to-actor: "true"
        continue-on-error: true
      - name: Assert action ran with limit-access-to-actor
        env:
          SSH_CMD: ${{ steps.upterm.outputs.ssh-command }}
          OUTCOME: ${{ steps.upterm.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ssh-command: $SSH_CMD"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SSH_CMD" ]; then
              echo "FAIL: action succeeded but ssh-command output is empty"
              exit 1
            fi
            echo "PASS: got ssh-command '$SSH_CMD'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/server unreachable or actor has no SSH keys)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
