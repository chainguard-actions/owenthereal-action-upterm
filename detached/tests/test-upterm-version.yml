name: Test upterm-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          upterm-server: "ssh://uptermd.upterm.dev:22"
          upterm-version: "v0.32.0"
          wait-timeout-minutes: "1"
          detached: "true"
      - name: Assert action ran with upterm-version input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SSH_CMD: ${{ steps.action.outputs.ssh-command }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ssh-command: $SSH_CMD"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SSH_CMD" ]; then
              echo "FAIL: action succeeded but ssh-command output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with ssh-command: $SSH_CMD"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/server may be unavailable in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
