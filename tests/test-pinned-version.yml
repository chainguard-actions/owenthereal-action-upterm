name: Test pinned upterm version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          upterm-server: "ssh://uptermd.upterm.dev:22"
          upterm-version: "v0.20.0"
          detached: "true"
          wait-timeout-minutes: "1"
        continue-on-error: true
      - name: Assert action ran with pinned version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail gracefully (network issues in CI are expected).
          # What we verify is that the action accepted the upterm-version input and ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with pinned upterm-version input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
