name: Test limit-access-to-users input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test limit-access-to-users with invalid timeout is rejected
        id: users-invalid-timeout
        uses: .
        with:
          upterm-server: "ssh://uptermd.upterm.dev:22"
          limit-access-to-users: "octocat"
          wait-timeout-minutes: "abc"
        continue-on-error: true
      - name: Assert action failed on invalid timeout
        env:
          OUTCOME: ${{ steps.users-invalid-timeout.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid wait-timeout-minutes, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid wait-timeout-minutes"
      - name: Test limit-access-to-users with over-limit timeout is rejected
        id: users-over-limit
        uses: .
        with:
          upterm-server: "ssh://uptermd.upterm.dev:22"
          limit-access-to-users: "octocat"
          wait-timeout-minutes: "1441"
        continue-on-error: true
      - name: Assert action failed on over-limit timeout
        env:
          OUTCOME: ${{ steps.users-over-limit.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with wait-timeout-minutes > 1440, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected wait-timeout-minutes exceeding 1440"
