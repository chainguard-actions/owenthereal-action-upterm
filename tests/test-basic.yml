name: Test basic upterm input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test invalid wait-timeout-minutes is rejected
        id: invalid-timeout
        uses: .
        with:
          upterm-server: "ssh://uptermd.upterm.dev:22"
          wait-timeout-minutes: "not-a-number"
        continue-on-error: true
      - name: Assert action failed on invalid timeout
        env:
          OUTCOME: ${{ steps.invalid-timeout.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid wait-timeout-minutes, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid wait-timeout-minutes"
      - name: Test negative wait-timeout-minutes is rejected
        id: negative-timeout
        uses: .
        with:
          upterm-server: "ssh://uptermd.upterm.dev:22"
          wait-timeout-minutes: "-1"
        continue-on-error: true
      - name: Assert action failed on negative timeout
        env:
          OUTCOME: ${{ steps.negative-timeout.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with negative wait-timeout-minutes, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected negative wait-timeout-minutes"
