name: Test detached mode with limit-access-to-users
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          upterm-server: "ssh://uptermd.upterm.dev:22"
          upterm-version: "v0.20.0"
          detached: "true"
          wait-timeout-minutes: "1"
          limit-access-to-users: "octocat"
      - name: Assert action ran in detached mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should have been invoked (not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran in detached mode with outcome=$OUTCOME"
