name: Test invalid upterm server
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # The action will attempt to connect to an invalid server and fail.
    # We use continue-on-error to capture the failure and assert on it.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          upterm-server: "ssh://127.0.0.1:1"
          wait-timeout-minutes: "1"

      - name: Assert action failed due to invalid server
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid server, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when connecting to invalid server"
