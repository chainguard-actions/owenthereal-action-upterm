name: Test custom upterm-server requires known-hosts
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          upterm-server: "ssh://upterm.invalid:22"
          wait-timeout-minutes: "1"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SSH_CMD: ${{ steps.action.outputs.ssh-command }}
          JOIN_CMD: ${{ steps.action.outputs.join-command }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ssh-command: $SSH_CMD"
          echo "join-command: $JOIN_CMD"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-default server without known-hosts"
            exit 1
          fi
          if [ -n "$SSH_CMD" ] || [ -n "$JOIN_CMD" ]; then
            echo "FAIL: outputs should be empty"
            exit 1
          fi
          echo "PASS"
