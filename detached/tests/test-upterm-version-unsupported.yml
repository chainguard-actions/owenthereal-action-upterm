name: Test unsupported upterm-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # upterm-version below the documented minimum (v0.32.0), combined with an
      # invalid wait-timeout so no real session can ever be started by this test.
      - id: action
        uses: .
        continue-on-error: true
        with:
          upterm-version: "v0.20.0"
          wait-timeout-minutes: "not-a-number"
      - name: Assert action did not start a session
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SSH_COMMAND: ${{ steps.action.outputs.ssh-command }}
          JOIN_COMMAND: ${{ steps.action.outputs.join-command }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ssh-command: $SSH_COMMAND"
          echo "join-command: $JOIN_COMMAND"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail for unsupported upterm-version / invalid timeout"
            exit 1
          fi
          if [ -n "$SSH_COMMAND" ] || [ -n "$JOIN_COMMAND" ]; then
            echo "FAIL: no session should have been started"
            exit 1
          fi
          echo "PASS"
