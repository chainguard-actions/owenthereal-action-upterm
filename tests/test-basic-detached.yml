name: Test basic detached mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          upterm-server: "ssh://uptermd.upterm.dev:22"
          detached: "true"
          wait-timeout-minutes: "1"
      - name: Assert ssh-command output is set
        env:
          SSH_CMD: ${{ steps.action.outputs.ssh-command }}
        run: |
          echo "ssh-command: $SSH_CMD"
          if [ -z "$SSH_CMD" ]; then
            echo "FAIL: expected ssh-command output to be non-empty"
            exit 1
          fi
          echo "PASS"
