name: Test limit-access-to-users input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          upterm-server: "ssh://uptermd.upterm.dev:22"
          limit-access-to-users: "octocat,github-actions"
          detached: "true"
          wait-timeout-minutes: "1"
        continue-on-error: true
      - name: Assert action ran with limit-access-to-users
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail gracefully (network issues in CI are expected).
          # What we verify is that the action accepted the limit-access-to-users input and ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with limit-access-to-users input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
