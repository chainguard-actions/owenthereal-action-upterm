name: Test invalid wait-timeout-minutes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          wait-timeout-minutes: "not-a-number"
          upterm-server: "ssh://upterm.invalid:22"
          known-hosts: "upterm.invalid ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIA6n8H2t4nX0Y5fG3pQ8yW0b0qEo1mHhR9kZ3F4vB7cD"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SSH_CMD: ${{ steps.action.outputs.ssh-command }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ssh-command: $SSH_CMD"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for non-integer wait-timeout-minutes"
            exit 1
          fi
          if [ -n "$SSH_CMD" ]; then
            echo "FAIL: ssh-command should be empty"
            exit 1
          fi
          echo "PASS"
