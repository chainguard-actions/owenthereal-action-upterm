name: Test specific upterm version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start upterm session with specific version and short timeout
        id: action
        uses: .
        continue-on-error: true
        with:
          upterm-server: "ssh://uptermd.upterm.dev:22"
          upterm-version: "v0.20.0"
          wait-timeout-minutes: "1"
          limit-access-to-actor: "false"
      - name: Assert action ran with specific version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail gracefully after timeout.
          # The key thing tested here is that the upterm-version input is accepted
          # and the action attempts to install v0.20.0 before connecting.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' using upterm-version v0.20.0"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
