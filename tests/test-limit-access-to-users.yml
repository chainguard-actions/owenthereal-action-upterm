name: Test limit access to specific users
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start upterm session limited to specific users
        id: action
        uses: .
        continue-on-error: true
        with:
          upterm-server: "ssh://uptermd.upterm.dev:22"
          limit-access-to-users: "owenthereal"
          wait-timeout-minutes: "1"
      - name: Assert action ran with user access restriction
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail gracefully after timeout.
          # The key thing tested here is that the limit-access-to-users input
          # is accepted and the action starts with user restriction configured.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' with user access restriction"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
