name: Test unsupported upterm-version is refused
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 5
        with:
          upterm-version: v0.31.0
      - name: Assert action refused upterm older than v0.32.0
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SSH_COMMAND: ${{ steps.action.outputs.ssh-command }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ssh-command: $SSH_COMMAND"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SSH_COMMAND" ]; then
            echo "FAIL: no session should have been started"
            exit 1
          fi
          echo "PASS"
