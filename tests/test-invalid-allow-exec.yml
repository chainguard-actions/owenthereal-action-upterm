name: Test non-boolean allow-exec is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          allow-exec: "yes"
      - name: Assert action failed input validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SSH_COMMAND: ${{ steps.action.outputs.ssh-command }}
        run: |
          echo "outcome: $OUTCOME"
          echo "ssh-command: $SSH_COMMAND"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for allow-exec=yes"
            exit 1
          fi
          if [ -n "$SSH_COMMAND" ]; then
            echo "FAIL: no session should have been started"
            exit 1
          fi
          echo "PASS"
